[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stc"
version = "0.2.0"
description = "Streaming Token Compression for video LLMs (STC-Cacher + STC-Pruner)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
]

[project.optional-dependencies]
hf = ["transformers>=4.40"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stc*"]
exclude = [
    "models*",
    "benchmarks*",
    "results*",
    "scripts*",
]
